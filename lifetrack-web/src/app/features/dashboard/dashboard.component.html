<div class="dashboard-container" *ngIf="authService.currentUser$ | async as user">
  
  <header class="dashboard-header">
    <h1>Welcome back, {{ user.displayName }}!</h1>
    <button mat-stroked-button color="warn" (click)="logout()">
      <mat-icon>logout</mat-icon>
      Logout
    </button>
  </header>

  <mat-card class="module-card">
    <mat-card-header>
      <mat-card-title>Today's Overview</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <p>Your Diet, Workout, and Study modules will appear here.</p>
    </mat-card-content>
  </mat-card>

</div>
